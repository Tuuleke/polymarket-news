# Local stack: `make up` (or `docker compose up --build`), then `make seed`.
#   frontend → http://localhost:3000   API → http://localhost:8000/docs
# .env is optional; without it the defaults below and in pmnews.core.config apply.

x-env: &env
  env_file:
    - path: .env
      required: false

services:
  db:
    # Postgres 16 with the pgvector extension available (used for RAG in Phase 4).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pmnews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pmnews-local}
      POSTGRES_DB: ${POSTGRES_DB:-pmnews}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    # One-shot: applies Alembic migrations, then exits. The API waits for it.
    build: .
    <<: *env
    environment: &api-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pmnews}:${POSTGRES_PASSWORD:-pmnews-local}@db:5432/${POSTGRES_DB:-pmnews}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    <<: *env
    environment: *api-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    restart: unless-stopped
    <<: *env
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
