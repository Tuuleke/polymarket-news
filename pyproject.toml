[project]
name = "pmnews"
version = "0.2.0"
description = "AI-generated news articles from prediction-market data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "apscheduler>=3.10,<4",
    "asyncpg",
    "fastapi",
    "httpx",
    "openai",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "testcontainers[postgres]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmnews"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Frozen thesis harness, ported to evals/ in Phase 5.
extend-exclude = ["prompt-evaluation"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "DTZ", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
